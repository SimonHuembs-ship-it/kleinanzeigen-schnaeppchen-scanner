name: Scan

# Stufe 1: sammelt die Rohdaten, bevor die Routine um 07:00 urteilt.
# Cron steht in UTC. Im Winter laeuft der Scan dadurch eine Stunde frueher,
# was unkritisch ist, weil bis 07:00 genug Puffer bleibt.

on:
  schedule:
    # Alle vier Stunden ueber ein Fuenf-Stunden-Fenster mit Ueberlappung.
    # Der Sammler laeuft oefter als gemeldet wird: er fuellt nur die Warteschlange,
    # damit ein Fund nicht erst Stunden nach dem Inserat entdeckt wird. Gemailt
    # wird trotzdem nur zweimal taeglich, das entscheidet die Routine.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      stunden:
        description: "Zeitfenster in Stunden"
        default: "5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet -r requirements.txt

      - name: Scan
        env:
          KLEINANZEIGEN_BASIC_USER: ${{ secrets.KLEINANZEIGEN_BASIC_USER }}
          KLEINANZEIGEN_BASIC_PW: ${{ secrets.KLEINANZEIGEN_BASIC_PW }}
        run: python -m scanner.main --stunden "${{ inputs.stunden || 5 }}" --limit 40

      - name: Ergebnis committen
        run: |
          git config user.name "kleinanzeigen-scanner"
          git config user.email "actions@github.com"

          # Kein Rebase. Der Scan laeuft bis zu einer Stunde, in der Zeit pusht
          # die Routine ihre Funde. Ein Rebase kollidiert dann zwangslaeufig in
          # candidates.json, seen_ads.csv und runs/, weil beide Seiten dieselben
          # maschinell erzeugten Dateien anfassen. Stattdessen: HEAD auf den
          # neuesten Stand setzen und unsere Dateien darauf legen. Der Arbeits-
          # baum bleibt erhalten, ein Konflikt kann gar nicht entstehen.
          git fetch -q origin main
          git reset -q --soft origin/main

          # Diese drei Dateien gehoeren der Routine, nicht dem Sammler. Haette
          # sie waehrend des Scans Funde gemeldet, wuerde unser aelterer Stand
          # sie sonst ueberschreiben.
          git checkout -q origin/main -- deal_log.csv deals.json email_output.html || true

          # Und danach die Warteschlange gegen das nun aktuelle Meldeprotokoll
          # nachfiltern, damit gerade gemeldete Funde nicht wieder auftauchen.
          python - <<'FILTER'
          import csv, json, pathlib
          kandidaten = pathlib.Path("candidates.json")
          log = pathlib.Path("deal_log.csv")
          if kandidaten.exists() and log.exists():
              with log.open(encoding="utf-8") as datei:
                  gemeldet = {z.get("ad_id") for z in csv.DictReader(datei)}
              daten = json.loads(kandidaten.read_text(encoding="utf-8"))
              vorher = len(daten.get("kandidaten", []))
              daten["kandidaten"] = [k for k in daten.get("kandidaten", [])
                                     if k["id"] not in gemeldet]
              if len(daten["kandidaten"]) != vorher:
                  kandidaten.write_text(json.dumps(daten, ensure_ascii=False, indent=2),
                                        encoding="utf-8")
                  print(f"{vorher - len(daten['kandidaten'])} bereits gemeldete entfernt")
          FILTER

          git add -A
          git diff --staged --quiet && echo "nichts Neues" && exit 0
          git commit -q -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:main
