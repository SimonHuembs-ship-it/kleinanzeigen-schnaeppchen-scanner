# Jagdziele fuer den Schnaeppchen-Scanner.
#
# verfahren: keyword  -> gezielte Suchen inkl. Falschschreibungen. Billig,
#                        richtig fuer Nischen mit wenigen Anzeigen pro Tag.
# verfahren: sweep    -> ganze Kategorie im Zeitfenster, Matching lokal.
#                        Tippfehlerimmun, aber teuer. Nur mit Preisband.
#
# schwelle: Anteil des Referenzmedians, bis zu dem ein Treffer weitergeht.
# angebotsaufschlag: Abschlag auf den Median, weil Angebotspreise ueber den
#   tatsaechlich erzielten liegen. Bei Fahrzeugen mit 8 bis 15 Prozent belegt.

einstellungen:
  rate_limit: 0.8
  mindestpunkte: 60
  # Zwischen 25 und 45 Prozent Marktwert sind Betrug und Totalschaden
  # haeufiger als echte Funde. Dort gilt eine hoehere Huerde.
  mindestpunkte_tiefpreis: 80
  # Harte Obergrenze pro Lauf. Wird sie erreicht, bricht der Scan ab und
  # vermerkt das im Laufprotokoll, statt still weniger zu liefern.
  max_requests: 6500
  # Neun Sweeps statt sechs, dazu erzeugte Tippfehler.

ziele:

  # -- Fahrzeuge -------------------------------------------------------------

  - id: porsche-911
    aktiv: true
    verfahren: sweep
    kategorie: 216
    preis_min: 25000
    preis_max: 160000
    schwelle: 0.75
    angebotsaufschlag: 0.10
    muster:
      - '\b911\b'
      - '\b99[123](\.\d)?\b'
      - '\bcarrera\b'
      - '\bgt3\b'
      - '\belfer\b'
    tippfehler: [porshe, porche, prosche, posche, carrea, carera, carrerra, trubo]
    ausschluss: [cayenne, macan, panamera, taycan, boxster, cayman, modellauto,
                 "1:18", "1:43", felgen, teppich, schluesselanhaenger, sitze,
                 lenkrad, auspuff, motorhaube, stossstange, teileträger, "et träger"]
    referenz_query: auto
    referenz_marke: "Porsche 911"

  - id: tesla
    aktiv: true
    verfahren: sweep
    kategorie: 216
    preis_min: 12000
    preis_max: 70000
    schwelle: 0.72
    angebotsaufschlag: 0.10
    muster:
      - '\btesla\b'
    tippfehler: [telsa, tesle, performenc, perfomance, performence, longrange]
    ausschluss: [wandladestation, wallbox, ladekabel, felgen, modellauto,
                 spielzeug, "tesla coil", teslaspule, powerwall]
    referenz_query: auto
    referenz_marke: "Tesla"

  - id: youngtimer-alltag
    aktiv: true
    verfahren: sweep
    kategorie: 216
    preis_min: 1500
    preis_max: 25000
    schwelle: 0.70
    angebotsaufschlag: 0.10
    # Die hoechsten Wertzuwaechse liegen bei ehemaligen Alltagsautos, nicht bei
    # den Ikonen: Honda CRX +260 Prozent seit 2020, BMW 325i Baur +245.
    muster:
      - '\bw12[46]\b'
      - '\bw201\b'
      - '\br129\b'
      - '\be30\b'
      - '\be36\b'
      - '\bcrx\b'
      - '\bgolf\s*(1|i|2|ii)\s*(gti|g60)\b'
      - '\bcorrado\b'
      - '\b944\b'
      - '\b968\b'
      - '\bur[- ]?quattro\b'
      - '\bintegrale\b'
      - '\bcosworth\b'
      - '\b850\s*t5\b'
    tippfehler: [bwm, merzedes, mercedez, quatro, intergrale, coswort, yountimer]
    # Billige Oberklasse-Youngtimer sind Wertfallen, keine Funde: W140 S320 in
    # Zustand 3 kostet 7.100 Euro und frisst ein Vielfaches an Elektronik.
    ausschluss: [w140, a8, 750i, 730i, "s 320", "s320", teileträger, "et träger",
                 modellauto, felgen, prospekt, ersatzteile, bastlerfahrzeug]
    referenz_query: auto
    referenz_marke: ""

  # -- Consumer-Elektronik ---------------------------------------------------

  - id: apple-mobil
    aktiv: true
    verfahren: sweep
    kategorie: 173
    preis_min: 150
    preis_max: 2000
    schwelle: 0.70
    muster:
      - '\biphone\s*1[2-7]\b'
    tippfehler: [ipone, iphon, "i-phone", iphione, ihpone, aple]
    ausschluss: [huelle, hülle, case, panzerglas, ladekabel, adapter, display,
                 ersatzteil, defekt, backcover, akku, kaputt, gesperrt, icloud]
    referenz_query: auto
    referenz_marke: "iPhone"

  - id: macbook
    aktiv: true
    verfahren: sweep
    kategorie: 278
    preis_min: 300
    preis_max: 5000
    schwelle: 0.70
    muster:
      - '\bmacbook\b'
      - '\bmbp\b'
    tippfehler: [mackbook, macbock, macboock, "mac book"]
    ausschluss: [huelle, hülle, tasche, netzteil, ladekabel, display, ersatzteil,
                 defekt, tastatur, akku, logicboard, "nur teile", neo]
    referenz_query: auto
    referenz_marke: "MacBook"

  - id: grafikkarten
    aktiv: true
    verfahren: sweep
    kategorie: 225
    preis_min: 250
    preis_max: 5000
    schwelle: 0.70
    # Speicherkrise: gebrauchte GPUs sind derzeit im Wert steigende Gueter. Wer
    # nach dem Preisgefuehl von 2024 einstellt, liegt massiv unter Markt.
    muster:
      - '\brtx\s*(3090|4080|4090|5080|5090)\b'
      - '\btesla\s*(p40|p100|v100)\b'
      - '\ba[0-9]{3,4}\s*(gpu|grafikkarte)\b'
    tippfehler: [nvidea, nividia, geforze, "ge force", graphikkarte, grafikarte]
    ausschluss: [wasserkuehler, wakue, backplate, halterung, riser, luefter,
                 defekt, "nur karton", ovp only, attrappe]
    referenz_query: auto
    referenz_marke: "Nvidia"

  - id: kameras-leica
    aktiv: true
    verfahren: keyword
    # Zeitfilter an: Vorrang haben neue Inserate.
    zeitfilter: true
    tippfehler_auto: 5
    kategorie: 245
    preis_min: 200
    preis_max: 20000
    schwelle: 0.70
    muster:
      - '\b(leica|leitz|leika|leia|leca)\b'
      - '\b(summicron|summilux|noctilux|elmarit|elmar|sumicron)\b'
    begriffe: ["Leica M", "Leitz Objektiv", "Summicron", "Summilux",
               "Leica Nachlass", "Leica Konvolut"]
    tippfehler: [leika, leia, leca, leiga, sumicron, summikron, noktilux]
    ausschluss: [huelle, tasche, filter, gegenlichtblende, deckel, riemen,
                 prospekt, buch, poster, repro, replika, kameratasche, blitz]
    # Mikroskope, Vergroesserer und Focotar-Objektive bleiben ausdruecklich
    # drin: der Leitz-Biomed-Fund vom 5. August war 200 Euro fuer vier
    # Leitz-Objektive, von denen eines allein 299 bis 369 Euro kostet.
    # Leitz-Optik ist Ziel, nicht Zubehoer.
    referenz_query: auto
    referenz_marke: "Leica"
    ohne_referenz: 3

  # -- Nischenteile ----------------------------------------------------------

  - id: tempomat-nachruest
    aktiv: true
    verfahren: keyword
    # Zeitfilter an: Vorrang haben neue Inserate.
    zeitfilter: true
    tippfehler_auto: 5
    preis_max: 1200
    schwelle: 0.70
    # AP60B ist kein Dometic-Produkt, sondern der australische Command-Klon
    # des Waeco MS-50. Beide Linien deshalb getrennt suchen.
    muster:
      - '\b(magicspeed|magic\s*speed|ms[- ]?50|ap\s*60\s*b)\b'
      - '\btempomat\b'
    begriffe: ["Waeco MagicSpeed", "MS-50 Tempomat", "AP60B", "MagicSpeed MS50",
               "Dometic MagicSpeed", "Tempomat Nachruestsatz"]
    tippfehler: ["Magic Speed MS 50", "Waeco MS-50", "MS50 Tempomat",
                 "Tempomat nachruesten", "AP 60B"]
    ausschluss: [gesucht, defekt, anleitung, prospekt]
    referenz_query: "MagicSpeed MS-50 Tempomat"

  - id: studio-audio
    aktiv: true
    verfahren: keyword
    # Zeitfilter an: Vorrang haben neue Inserate.
    zeitfilter: true
    tippfehler_auto: 5
    preis_min: 100
    preis_max: 8000
    schwelle: 0.70
    # Ein Neumann KM84 ist ein unscheinbares Staebchenmikrofon fuer 2.650 bis
    # 2.980 Euro und wird aus Nachlaessen regelmaessig auf 150 Euro taxiert.
    muster:
      - '\b(neumann|neuman)\b'
      - '\bakg\s*c\s*\d{2,3}\b'
      # refox bewusst nicht: eine echte Marke fuer Reparaturgeraete,
      # kein Revox-Tippfehler.
      - '\b(revox|revoy|studer|studert)\b'
      - '\b(km\s*8[④4]|u\s*8[77]|u\s*47|c\s*12)\b'
      - '\b(urei|teletronix|la[- ]2a|1176)\b'
    begriffe: ["Neumann Mikrofon", "Neumann KM84", "Neumann U87", "AKG C414",
               "Revox PR99", "Studer Tonbandmaschine", "Neumann Nachlass"]
    tippfehler: [neuman, "neumann u 87", "akg c 414", revoy, studert]
    ausschluss: [nachbau, clone, replika, china, staender, spinne, kabel,
                 popschutz, adapter, prospekt]
    referenz_query: auto
    referenz_marke: ""
    ohne_referenz: 5

  - id: vintage-hifi
    aktiv: true
    verfahren: keyword
    # Zeitfilter an: Vorrang haben neue Inserate.
    zeitfilter: true
    tippfehler_auto: 5
    preis_min: 100
    preis_max: 15000
    schwelle: 0.70
    muster:
      - '\b(technics|techniks|technix|tehnics)\b'
      - '\b(thorens|thorrens|thoren|torens)\b'
      - '\b(linn|sondek|sondeck)\b'
      - '\b(klipsch|klipsh|klipch|klipschorn|la\s*scala|heresy)\b'
      - '\b(mc\s*intosh|mcintosh|makintosh)\b'
      - '\bquad\s*(esl|303|405)\b'
      - '\b(nakamichi|nakamishi|nacamichi)\b'
      - '\b(tannoy|tanoy|accuphase|acuphase|luxman|luxmann)\b'
      - '\bjbl\s*(l\s*100|43\d{2})\b'
    begriffe: ["Technics SL-1200", "Thorens TD", "Linn Sondek", "Klipschorn",
               "McIntosh Verstaerker", "Quad ESL", "Nakamichi Dragon",
               "Tannoy Monitor", "Accuphase", "Luxman Verstaerker"]
    tippfehler: [techniks, technix, tehnics, thorrens, thoren, torens,
                 klipsh, klipch, "mc intosh", makintosh, nakamishi]
    # TA Technix ist eine Fahrwerksmarke und faengt sich sonst im
    # Technics-Tippfehlermuster.
    ausschluss: ["ta technix", gewindefahrwerk, fahrwerk, federbein, felgen,
                 nadel, riemen, haube, prospekt, poster, nachbau, replika]
    referenz_query: auto
    referenz_marke: ""
    ohne_referenz: 5

  # -- Notverkaeufe kategorieuebergreifend -----------------------------------

  - id: notverkaeufe
    aktiv: true
    verfahren: keyword
    # Zeitfilter an: Vorrang haben neue Inserate.
    zeitfilter: true
    tippfehler_auto: 5
    preis_min: 300
    preis_max: 50000
    schwelle: 0.80
    # Die Suche ist unscharf, deshalb muss der Anlass wirklich im Titel stehen.
    muster:
      - '\bnot(fall)?verkauf\b'
      - '\b\w*aufl(oe|ö)sung\b'
      - '\bnachlass\w*\b'
      - '\bhaushalsaufl(oe|ö)sung\b'
      - '\berbschaft\b'
      - '\bscheunenfund\b'
      - '\bentr(ue|ü)mpelung\b'
      - '\bh(oe|ö)re\s+mit\s+dem\s+hobby\s+auf\b'
      - '\bsammlung\s+(wird\s+)?aufgel(oe|ö)st\b'
    begriffe: ["Notverkauf", "Notfallverkauf", "Sammlungsaufloesung",
               "Nachlass Sammlung", "Haushaltsaufloesung", "Wohnungsaufloesung",
               "Geschaeftsaufloesung", "Studioaufloesung", "Praxisaufloesung",
               "Scheunenfund", "Erbschaft Sammlung", "Sammlung wird aufgeloest"]
    tippfehler: ["Not Verkauf", "Sammlungs Aufloesung"]
    ausschluss: [gesucht, ankauf, entruempelung, container]
    referenz_query: auto
    referenz_marke: ""
    ohne_referenz: 8

  # -- Zusaetzliche Kategorie-Sweeps -----------------------------------------
  # Ohne Suchbegriff und damit tippfehlerimmun. Ergaenzen die Keyword-Ziele:
  # der Sweep faengt Neuzugaenge, die Keyword-Suche den Altbestand.

  - id: foto-sweep
    aktiv: true
    verfahren: sweep
    kategorie: 245
    preis_min: 150
    preis_max: 25000
    schwelle: 0.70
    muster:
      - '\b(leica|leitz|leika|leia|leca|leiga)\b'
      - '\b(summicron|summilux|noctilux|elmarit|elmar|sumicron|summikron)\b'
      - '\b(hasselblad|hasselbald|haselblad)\b'
      - '\b(zeiss|ziess|zeis|biogon|planar|distagon|sonnar)\b'
      - '\b(contax|kontax)\s*(t2|t3|g1|g2|rts)\b'
      - '\b(mamiya|mamia)\s*(rz|rb|7)\b'
      - '\brollei(flex)?\s*(35|2\.8|3\.5)\b'
      - '\bpentax\s*(67|6x7)\b'
    tippfehler: [leika, leia, sumicron, hasselbald, ziess, mamia]
    ausschluss: [huelle, hülle, tasche, filter, gegenlichtblende, deckel, riemen,
                 prospekt, buch, poster, repro, replika, adapter, "nur karton", kameratasche, blitz]
    # Mikroskope, Vergroesserer und Focotar-Objektive bleiben ausdruecklich
    # drin: der Leitz-Biomed-Fund vom 5. August war 200 Euro fuer vier
    # Leitz-Objektive, von denen eines allein 299 bis 369 Euro kostet.
    # Leitz-Optik ist Ziel, nicht Zubehoer.
    referenz_query: auto
    referenz_marke: ""

  - id: hifi-sweep
    aktiv: true
    verfahren: sweep
    kategorie: 172
    preis_min: 100
    preis_max: 20000
    schwelle: 0.70
    muster:
      - '\b(technics|techniks|technix|tehnics)\s*(sl|sp|1200|1210)\b'
      - '\b(thorens|thorrens|thoren|torens)\b'
      - '\b(linn|sondek|sondeck)\b'
      - '\b(klipsch|klipsh|klipch|klipschorn|la\s*scala|heresy)\b'
      - '\b(mc\s*intosh|mcintosh|makintosh)\b'
      - '\bquad\s*(esl|303|405)\b'
      - '\b(nakamichi|nakamishi|nacamichi)\b'
      # refox bewusst nicht: eine echte Marke fuer Reparaturgeraete,
      # kein Revox-Tippfehler.
      - '\b(revox|revoy|studer|studert)\b'
      - '\b(neumann|neuman)\b'
      - '\b(tannoy|tanoy|accuphase|acuphase|luxman|luxmann)\b'
      - '\bjbl\s*(l\s*100|43\d{2})\b'
      - '\b(stax|sennheiser)\s*(sr|hd)\s*\d{3}\b'
    tippfehler: [techniks, thorrens, klipsh, makintosh, nakamishi, revoy, neuman]
    ausschluss: ["ta technix", gewindefahrwerk, fahrwerk, federbein, felgen,
                 nadel, riemen, haube, prospekt, poster, nachbau, replika,
                 auspuff, sportauspuff]
    referenz_query: auto
    referenz_marke: ""

  - id: konsolen-sweep
    aktiv: true
    verfahren: sweep
    kategorie: 279
    preis_min: 60
    preis_max: 3000
    schwelle: 0.70
    muster:
      - '\bps5\s*pro\b'
      - '\bsteam\s*deck\s*(oled|1tb|512)\b'
      - '\bneo\s*geo\b'
      - '\bvirtual\s*boy\b'
      - '\b(pc\s*engine|turbografx|supergrafx)\b'
      - '\b(sega\s*saturn|dreamcast)\b'
      - '\bn64\b'
      - '\bnintendo\s*64\b'
      - '\bgamecube\b'
      - '\bsnes\b'
    tippfehler: [playstaion, palystation, gamecupe, dreamcst, neogeo, nintento]
    ausschluss: [huelle, tasche, controller einzeln, kabel, netzteil, adapter,
                 nachbau, replika, repro, aufkleber, poster, "nur spiel"]
    referenz_query: auto
    referenz_marke: ""
