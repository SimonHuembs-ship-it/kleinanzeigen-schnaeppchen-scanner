    verfahren: sweep
    preis_min: 300
    preis_max: 150000
    schwelle: 0.72
    muster:
      - '\b(rolex|tudor|omega\s*(speedmaster|seamaster|constellation))\b'
      - '\b(iwc|jaeger|lecoultre|zenith\s*el\s*primero|breitling\s*navitimer)\b'
      - '\b(grand\s*seiko|seiko\s*(sbdx|sla|skx))\b'
      - '\b(sinn\s*\d{3}|nomos|junghans\s*max\s*bill|glash(ue|ü)tte)\b'
      - '\b(heuer|longines|doxa|certina\s*ds)\b'
